syntax = "proto3";

package weather_provider.v1;

import "google/protobuf/timestamp.proto";

// Each service's buf.gen.yaml overrides this to its own internal/gen path.
option go_package = "weather_provider/v1";

// ForecastService serves the latest stored forecast snapshot per location.
// Alerts ride inside the forecast response: they live in the same cache
// document, so a separate RPC would re-read the same data.
service ForecastService {
  rpc GetForecast(GetForecastRequest) returns (GetForecastResponse);
}

message ForecastPoint {
  google.protobuf.Timestamp valid_time = 1;
  double temp_c = 2;
  double temp_f = 3;
  double temp_feel_c = 4;
  double temp_feel_f = 5;
  double dewpoint_c = 6;
  double dewpoint_f = 7;
  int32 humidity_percent = 8;
  int32 uv_index = 9;
  int32 precipitation_percent = 10;
  double pressure_mb = 11;
  int32 wind_dir_deg = 12;
  double wind_speed_kph = 13;
  double wind_gust_kph = 14;
}

// Alert mirrors the source-agnostic shared.Alert contract.
message Alert {
  string id = 1;
  string location_id = 2;
  string source = 3;
  string rule_id = 4;
  string severity = 5;
  string metric = 6;
  double value = 7;
  double threshold = 8;
  google.protobuf.Timestamp window_start = 9;
  google.protobuf.Timestamp window_end = 10;
  string message = 11;
  string status = 12;
  google.protobuf.Timestamp issued_at = 13;
}

message Forecast {
  string location_id = 1;
  google.protobuf.Timestamp issued_at = 2;
  google.protobuf.Timestamp last_updated = 3;
  repeated ForecastPoint points = 4;
  repeated Alert alerts = 5;
}

message GetForecastRequest {
  string location_id = 1;
}

message GetForecastResponse {
  Forecast forecast = 1;
}
